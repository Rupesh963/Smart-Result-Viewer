<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<!-- ================= Navbar ================= -->
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center h-16">

            <!-- Logo -->
            <a href="#" class="text-2xl font-bold text-blue-600">
                Smart Result Viewer
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-8">
                <a th:href="@{'/'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Home
                </a>

                <a th:href="@{'/view-result'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    View Result
                </a>

                <a th:href="@{'/admin/add-result'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Add Result
                </a>

                <a th:href="@{'/help'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Help
                </a>

                <a href="#" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
                    Login
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn" class="md:hidden text-gray-700">
                ☰
            </button>

        </div>
    </div>
</nav>

<!-- ================= Center Form ================= -->

<main class="flex items-center justify-center min-h-[calc(100vh-64px)] px-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-800">
                Check Your Result
            </h1>

            <p class="text-slate-500 mt-3 text-lg">
                Enter your Roll Number and Date of Birth to securely access your examination result.
            </p>
        </div>

        <!-- Form -->
        <form novalidate th:action="@{'/view-result'}" th:object="${requestResultForm}" method="post" class="space-y-6">

            <!-- Roll Number -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Roll Number
                </label>

                <input
                        th:field="*{rollNumber}"
                        type="text"
                        name="rollNumber"
                        placeholder="Enter your Roll Number"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        required>
                <span class="text-red-700 p-2"
                      th:if="${#fields.hasErrors('rollNumber')}"
                      th:errors="*{rollNumber}">
                </span>
            </div>

            <!-- Date of Birth -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Date of Birth
                </label>

                <input
                        th:field="*{dateOfBirth}"
                        type="date"
                        name="dateOfBirth"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        required>
                <span class="text-red-700 p-2"
                      th:if="${#fields.hasErrors('dateOfBirth')}"
                      th:errors="*{dateOfBirth}">
                </span>
            </div>

            <!-- Button -->
            <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg transition duration-300">
                Get Result
            </button>

        </form>

    </div>

</main>

</body>
</html>
