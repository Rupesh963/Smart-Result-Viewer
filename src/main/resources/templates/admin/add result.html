<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<!--navbar-->
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center h-16">

            <!-- Logo -->
            <a href="#" class="text-2xl font-bold text-blue-600">
                Smart Result Viewer
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-8">
                <a th:href="@{'/'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Home
                </a>

                <a th:href="@{'/view-result'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    View Result
                </a>

                <a th:href="@{'/admin/add-result'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Add Result
                </a>

                <a th:href="@{'/help'}" class="text-gray-700 hover:text-blue-600 font-medium transition">
                    Help
                </a>

                <a href="#" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
                    Login
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn" class="md:hidden text-gray-700 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-8 w-8"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t">

        <a th:href="@{'/'}" class="block px-6 py-3 hover:bg-blue-50">
            Home
        </a>

        <a th:href="@{'/view-result'}" class="block px-6 py-3 hover:bg-blue-50">
            View Result
        </a>

        <a th:href="@{'/admin/add-result'}" class="block px-6 py-3 hover:bg-blue-50">
            Add Result
        </a>

        <a th:href="@{'/help'}" class="block px-6 py-3 hover:bg-blue-50">
            Help
        </a>

        <div class="px-6 py-4">
            <a href="#"
               class="block text-center bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                Login
            </a>
        </div>

    </div>
</nav>

<!--Show add result form-->
<div class="lg:w-2/3 w-full py-10 border shadow px-5  rounded mx-auto">

    <h1 class="text-3xl text-center text-grey-700 font-bold">Add Result </h1>
    <p class="mt-2 text-center text-gray-500">Add Student Result Data To Database...</p>

    <form novalidate th:action="@{/admin/add-result-action}" th:object="${studentForm}" method="Post" enctype="multipart/form-data">

        <!--Name-->
        <div class="mt-5">
            <label for="name" class="block mb-2.5 text-sm font-medium text-heading">Student Name</label>
            <input
                    th:field="*{name}"
                    type="text"
                   id="name"
                   class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                   placeholder="Enter student name"
                   required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <!--Roll Number-->
        <div class="mt-5">
            <label for="rollNumber" class="block mb-2.5 text-sm font-medium text-heading">Roll Number </label>
            <input
                    th:field="*{rollNumber}"
                    type="text"
                    id="rollNumber"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter Roll number"
                    required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></span>
        </div>

        <!--Email-->
        <div class="mt-5">
            <label for="email" class="block mb-2.5 text-sm font-medium text-heading"> Email </label>
            <input
                    th:field="*{email}"
                    type="email"
                    id="email"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter Email"
                    required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <!--Address-->
        <div class="mt-5">
            <label for="address" class="block mb-2.5 text-sm font-medium text-heading"> Address </label>
            <textarea
                    th:field="*{address}"
                    type="text"
                    id="address"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter Address"
                    required></textarea>
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
        </div>

        <!--SchoolName-->
        <div class="mt-5">
            <label for="schoolName" class="block mb-2.5 text-sm font-medium text-heading">School Name</label>
            <input
                    th:field="*{schoolName}"
                    type="text"
                    id="schoolName"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter School Name"
                    required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('schoolName')}" th:errors="*{schoolName}"></span>
        </div>

        <!--DOB-->
        <div class="mt-5">
            <label for="dateOfBirth" class="block mb-2.5 text-sm font-medium text-heading"> Date Of Birth</label>
            <input
                    th:field="*{dateOfBirth}"
                    type="date"
                    id="dateOfBirth"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter DateOfBirth "
                    required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
        </div>

        <!--standard-->
        <div class="mt-5">
            <label for="standard" class="block mb-2.5 text-sm font-medium text-heading"> Standard</label>
            <select class="w-full border shadow " id="standard" th:field="*{standard}">

                <option th:each="standard : ${standardOptions}" th:value="${standard}" th:text="${standard}"></option>

            </select>

        </div>

        <!--Father name -->

        <div class="mt-5">
            <label for="fatherName" class="block mb-2.5 text-sm font-medium text-heading">Father Name</label>
            <input
                    th:field="*{fatherName}"
                    type="text"
                    id="fatherName"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                    placeholder="Enter Father  name"
                    required />
            <span class="text-red-700 p-2" th:if="${#fields.hasErrors('fatherName')}" th:errors="*{fatherName}"></span>
        </div>

        <!--gender-->
        <div class="mt-4">

            <label class="block mb-2.5 text-sm font-medium text-heading">Select gender</label>

            <label class="flex items-center gap-2 cursor-pointer">
                <input
                        th:field="*{gender}"
                        th:value="male"
                        type="radio"
                        name="gender"
                        value="male"
                        class="w-4 h-4 text-blue-600"
                />
                Male
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
                <input
                        th:field="*{gender}"
                        th:value="female"
                        type="radio"
                        name="gender"
                        value="female"
                        class="w-4 h-4 text-pink-600"
                />
                Female
            </label>

        </div>

        <!--subject and marks-->
        <div>
            <div id="marks_container">
                <div class="flex gap-4 rounded border px-3 mt-3 py-4">
                    <div class="flx flx-col">
                        <label>Subject</label>
                        <input type="text" placeholder="Enter subject">
                    </div>
                    <div class="flex flex-col">
                        <label>Marks</label>
                        <input  type="text" placeholder="Enter marks">
                    </div>
                    <div class="flex flex-col">
                        <label>Grade</label>
                        <input type="text" placeholder="Enter Grade">
                    </div>
                    <div class="flex flex-col">
                        <label>Feedback</label>
                        <input type="text" placeholder="Enter Feedback">
                    </div>
                </div>
            </div>
            <div class="flex justify-center my-4">
                <button onclick="addMarksRow()" type="button" class="text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Add Subject Marks</button>
            </div>
        </div>

        <!--Button-->
        <div class="mt-4 flex justify-center gap-4">
            <button type="reset" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Clear</button>

            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Add Result</button>
        </div>


    </form>

</div>
<script>
    function addMarksRow() {
        const container = document.getElementById('marks_container')

        container.innerHTML = container.innerHTML +  `<div class="flex gap-4 rounded border px-3 mt-3 py-4">
                    <div class="flx flx-col">
                        <label>Subject</label>
                        <input type="text" placeholder="Enter subject">
                    </div>
                    <div class="flex flex-col">
                        <label>Marks</label>
                        <input  type="text" placeholder="Enter marks">
                    </div>
                    <div class="flex flex-col">
                        <label>Grade</label>
                        <input type="text" placeholder="Enter Grade">
                    </div>
                    <div class="flex flex-col">
                        <label>Feedback</label>
                        <input type="text" placeholder="Enter Feedback">
                    </div>
                </div> `
    }
</script>

</body>
</html>
